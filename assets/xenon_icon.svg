<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Xenon toolbar icon (32x32): simplified, bolder cut of xenon_logo.svg. No ring, no blur, larger mark. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26225a"/>
      <stop offset="1" stop-color="#110f2a"/>
    </linearGradient>
    <linearGradient id="gas" gradientUnits="userSpaceOnUse" x1="100" y1="412" x2="412" y2="100">
      <stop offset="0" stop-color="#5fe8ff"/>
      <stop offset="0.5" stop-color="#9590ff"/>
      <stop offset="1" stop-color="#df9cff"/>
    </linearGradient>
    <linearGradient id="gas2" gradientUnits="userSpaceOnUse" x1="100" y1="100" x2="412" y2="412">
      <stop offset="0" stop-color="#b49aff"/>
      <stop offset="1" stop-color="#7b98ff"/>
    </linearGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <line x1="80" y1="432" x2="432" y2="80" stroke="#000" stroke-width="150"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#tile)"/>
  <line x1="112" y1="112" x2="400" y2="400" stroke="url(#gas2)" stroke-width="88" stroke-linecap="round" mask="url(#gap)"/>
  <line x1="112" y1="400" x2="306" y2="206" stroke="url(#gas)" stroke-width="88" stroke-linecap="round"/>
  <polygon points="420,92 394,236 276,118" fill="url(#gas)" stroke="url(#gas)" stroke-width="22" stroke-linejoin="round"/>
</svg>
